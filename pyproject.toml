[project]
name = "conduit-agent"
version = "0.1.0"
description = "Open control plane for coding agents: portable policy, real isolation, completion-true handoffs, topology-aware parallel work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zinley Lab", email = "khoi.nguyen@zinley.com" }]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
conduit = "conduit.cli:main"

[project.urls]
Homepage = "https://github.com/kn1026/conduit"
Repository = "https://github.com/kn1026/conduit"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
