name: example
version: "0.1"
default: ask
budget:
  max_usd: 10
  max_tokens: 500000
forbidden_write_globs:
  - ".git/hooks/**"
  - ".git/config"
  - ".git/worktrees/**"
  - "**/.env"
grants:
  - name: src-allow
    pattern: "src/**"
    decision: allow
  - name: tests-allow
    pattern: "tests/**"
    decision: allow
